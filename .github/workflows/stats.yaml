name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate terminal card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          corepack enable
          node scripts/fetch-stats.mjs --lines > stats.json
          FORCE_COLOR=3 pnpm dlx abdulkareem < /dev/null \
            | node scripts/render-card.mjs profile/card.svg --stats stats.json --overrides card-overrides.json

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/card.svg profile/stats.svg
          git commit -m "Update README cards [@bot] [skip ci]" || exit 0
          git push
