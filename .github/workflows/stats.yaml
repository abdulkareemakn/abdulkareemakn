name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

# Both a push to main and the daily schedule regenerate the same files. Without
# this, overlapping runs race and the loser's `git push` is rejected.
concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate terminal card
        env:
          # GITHUB_TOKEN is an installation token, which GitHub's API refuses
          # for viewer-scoped endpoints. GH_PAT, if the repository defines it,
          # is a user token and unlocks the contributed-repo row; without it the
          # card still renders, just without that figure.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          corepack enable
          node scripts/fetch-stats.mjs --lines > stats.json
          FORCE_COLOR=3 pnpm dlx abdulkareem < /dev/null \
            | node scripts/render-card.mjs profile/card.svg --stats stats.json --overrides card-overrides.json

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/card.svg profile/stats.svg
          git commit -m "Update README cards [@bot] [skip ci]" || exit 0
          git push
